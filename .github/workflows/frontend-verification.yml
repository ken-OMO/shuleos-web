name: Frontend verification
on:
  push:
    branches: [develop, 'feature/**', 'fix/**']
  pull_request:
permissions:
  contents: read
jobs:
  auth-and-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Print browser failure context
        if: failure()
        run: find test-results -name error-context.md -type f -exec cat {} \; 2>/dev/null || true
